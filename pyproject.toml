[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caguei-metasploit"
version = "0.1.0"
description = "CLI defensiva para organizar e auditar resultados de laboratórios autorizados"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Caguei Metasploit contributors"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
caguei-metasploit = "caguei_metasploit.cli:main"
cmsp = "caguei_metasploit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
